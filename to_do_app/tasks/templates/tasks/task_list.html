{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <div class="row">
    <!-- LEFT: Task titles -->
    <div class="col-4">
      <div id="task-list" class="list-group">
        {% for task in tasks %}
        <a
          class="list-group-item list-group-item-action d-flex align-items-center gap-2"
          href="#task-{{ task.id }}"
        >
          <input
            type="checkbox"
            class="form-check-input"
            {%
            if
            task.completed
            %}checked{%
            endif
            %}
            onclick="window.location.href='{% url 'task_toggle' task.id %}'"
          />
          <span
            {%
            if
            task.completed
            %}class="text-decoration-line-through"
            {%
            endif
            %}
          >
            {{ task.title }}
          </span>
        </a>
        {% endfor %}
      </div>
    </div>

    <!-- RIGHT: Task details -->
    <div class="col-8">
      <div
        data-bs-spy="scroll"
        data-bs-target="#task-list"
        data-bs-smooth-scroll="true"
        class="scrollspy-example"
        tabindex="0"
        style="height: 400px; overflow-y: auto"
      >
        {% for task in tasks %}
        <div id="task-{{ task.id }}" class="mb-4">
          <h4>{{ task.title }} {% if task.completed %}✔{% endif %}</h4>

          <p>{{ task.description }}</p>

          <p>
            <strong>Deadline:</strong>
            {{ task.deadline|default:"No deadline" }}
          </p>

          <a
            href="{% url 'task_update' task.id %}"
            class="btn btn-sm btn-warning"
            >Edit</a
          >
          <a
            href="{% url 'task_delete' task.id %}"
            class="btn btn-sm btn-danger"
            >Delete</a
          >

          <hr />
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
